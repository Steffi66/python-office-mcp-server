name: Independent Office oracle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Provision required oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc libreoffice-impress
          command -v soffice
          soffice --version
      - run: python -m pip install '.[dev]'
      - name: Calculate and render independently
        run: bash tests/run_tests.sh tests/test_libreoffice_oracle.py -q -o addopts='' --junitxml=test-results/oracle.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libreoffice-evidence
          path: test-results/
          retention-days: 7
