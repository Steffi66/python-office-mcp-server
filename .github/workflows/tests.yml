name: Python tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and tests
        run: python -m pip install '.[dev]'
      - name: Record resolved environment
        run: |
          mkdir -p test-results
          python --version > test-results/python.txt
          python -m pip freeze > test-results/dependencies.txt
      - name: Run one sequential test batch
        run: bash tests/run_tests.sh tests/ -q -o addopts='' --junitxml=test-results/pytest.xml
      - name: Verify wheel-backed MCP workflows
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          OFFICE_MCP_TEST_PYTHON="$PWD/.wheel-venv/bin/python" bash tests/run_tests.sh tests/test_stdio_mutation_workflows.py -q -o addopts='' --junitxml=test-results/wheel.xml
      - name: Check tracked files were not changed by verification
        if: always()
        run: git diff --exit-code
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: test-results/
          retention-days: 7
